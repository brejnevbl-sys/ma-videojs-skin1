name: Validate MA
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Ubuntu package mirrors are not reliably reachable in CI; skip apt dependency download.
      - run: npx playwright install chromium
      - run: npm test -- --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/results.json
      - run: node scripts/ci-summary.mjs
        if: always()
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/
